# Used by the admin panel's Netlify site (base directory: admin-web). Without this file
# Netlify falls back to the repo-root netlify.toml, which publishes the legal pages.
[build]
  command = "npm run build"
  publish = "dist"

# BrowserRouter routes (/payouts, /drivers, ...) must serve index.html on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

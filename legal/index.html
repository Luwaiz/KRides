<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KRides Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0066F5; --blue-deep: #0050c4; --blue-soft: #e8f0ff;
    --bg: #f4f6fb; --card: #ffffff; --ink: #10131a; --ink-muted: #5c6472; --border: #e7e9f0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --blue: #4d94ff; --blue-deep: #0066F5; --blue-soft: #16233a;
      --bg: #0b0e14; --card: #141821; --ink: #f2f4f8; --ink-muted: #9aa3b2; --border: #232838;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, var(--blue-deep), var(--blue) 42%, var(--bg) 42%);
    color: var(--ink);
    font-family: "Albert Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: max(36px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-left, 0px)) 40px;
  }
  .wrap { max-width: 420px; width: 100%; }
  .brand { display: flex; align-items: center; gap: 2px; margin-bottom: 40px; }
  .brand-word { font-weight: 800; font-size: 19px; color: #fff; letter-spacing: -0.01em; }
  h1 { color: #fff; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: rgba(255,255,255,0.78); font-size: 14px; margin: 0 0 28px; font-weight: 500; }
  a.link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 18px;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(16,19,26,0.04);
  }
  a.link .title { font-weight: 700; font-size: 15px; }
  a.link .desc { display: block; font-weight: 500; color: var(--ink-muted); font-size: 12.5px; margin-top: 3px; }
  a.link .arrow { color: var(--blue); font-weight: 800; font-size: 18px; flex: 0 0 auto; margin-left: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="brand-word">KRides<span style="color:#fff">.</span></span>
      <svg width="46" height="14" viewBox="0 0 46 14" fill="none">
        <path d="M2 11C14 2 32 2 44 7" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Legal</h1>
    <p class="sub">Krides — Kampus Rides</p>

    <a class="link" href="/privacy-policy">
      <span><span class="title">Privacy Policy</span><span class="desc">How we handle your data</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="link" href="/terms-and-conditions">
      <span><span class="title">Terms &amp; Conditions</span><span class="desc">Rules for using the app</span></span>
      <span class="arrow">→</span>
    </a>
  </div>
</body>
</html>
